<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kova Order API Test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #000; color: #fff; padding: 12px 24px; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    button:disabled { background: #999; }
    #result { margin-top: 20px; padding: 12px; border-radius: 4px; display: none; white-space: pre-wrap; font-size: 13px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>Kova Order API Test</h1>

  <form id="test-order-form">
    <div class="field">
      <label>Customer Name</label>
      <input type="text" name="billing_name" value="Test Customer" required>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" name="billing_email" value="test@example.com" required>
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" name="billing_phone" value="+234801234567">
    </div>
    <div class="field">
      <label>Address</label>
      <input type="text" name="billing_address" value="123 Test Street, Lagos">
    </div>
    <div class="field">
      <label>Order Items</label>
      <textarea name="order_items" rows="2">2x Product A, 1x Product B</textarea>
    </div>
    <div class="field">
      <label>Order Total (NGN)</label>
      <input type="number" name="order_total" value="5000">
    </div>
    <button type="submit">Submit via track.js</button>
    <button type="button" id="manual-btn">Submit Direct</button>
  </form>

  <div id="result"></div>

  <script src="https://kova.ng/track.js?token=03e48db222c74bcb9ec7a672a28a8fee" async></script>
  <script>
    const result = document.getElementById('result');

    function showResult(title, data, isError) {
      result.className = isError ? 'error' : 'success';
      result.innerHTML = '<strong>' + title + ':</strong>\n' + JSON.stringify(data, null, 2);
      result.style.display = 'block';
    }

    document.getElementById('test-order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fields = {};
      const formData = new FormData(form);
      for (const [key, value] of formData.entries()) {
        fields[key] = value;
      }

      const payload = {
        token: '03e48db222c74bcb9ec7a672a28a8fee',
        fields,
        meta: {
          url: window.location.href,
          ts: new Date().toISOString()
        }
      };

      try {
        const res = await fetch('https://kova.ng/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        showResult(res.ok ? 'track.js Flow Success' : 'track.js Flow Error', data, !res.ok);
      } catch (err) {
        showResult('Network Error', { message: err.message }, true);
      }
    });

    document.getElementById('manual-btn').addEventListener('click', async () => {
      const payload = {
        token: '03e48db222c74bcb9ec7a672a28a8fee',
        fields: {
          billing_name: 'Test Customer',
          billing_email: 'test@example.com',
          billing_phone: '+234801234567',
          billing_address: '123 Test Street, Lagos',
          order_items: '2x Product A, 1x Product B',
          order_total: '5000'
        },
        meta: {
          url: window.location.href,
          ts: new Date().toISOString()
        }
      };

      try {
        const res = await fetch('https://kova.ng/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        showResult(res.ok ? 'Direct API Success' : 'Direct API Error', data, !res.ok);
      } catch (err) {
        showResult('Network Error', { message: err.message }, true);
      }
    });
  </script>
</body>
</html>
