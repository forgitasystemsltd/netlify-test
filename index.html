        <h1>Product Sales/Checkout page</h1>

        <form id="test-order-form">
            <div class="field">
                <label>Customer Name</label>
                <input
                    type="text"
                    name="billing_name"
                    value="John Doe"
                    required
                />
            </div>
            <div class="field">
                <label>Email</label>
                <input
                    type="email"
                    name="billing_email"
                    value="john.doe@example.com"
                    required
                />
            </div>
            <div class="field">
                <label>Phone</label>
                <input type="tel" name="billing_phone" value="+2348012345678" />
            </div>
            <div class="field">
                <label>Address</label>
                <input
                    type="text"
                    name="billing_address"
                    value="123 PTI Road, Warri"
                />
            </div>
            <div class="field">
                <label>State</label>
                <select name="state" id="state-select">
                    <option value="">Select state</option>
                </select>
            </div>
            <div class="field">
                <label>City / LGA</label>
                <select name="city" id="city-select" disabled>
                    <option value="">Select state first</option>
                </select>
            </div>
            <div class="field">
                <label>Order Items</label>
                <div id="product-selector">
                    <div style="margin-bottom: 8px">
                        <button
                            type="button"
                            id="add-product-btn"
                            style="background: #007bff"
                        >
                            + Add Product
                        </button>
                    </div>
                    <div id="product-items"></div>
                </div>
                <input
                    type="hidden"
                    name="order_items"
                    id="order-items-hidden"
                />
            </div>
            <div class="field">
                <label>Order Total (NGN)</label>
                <input
                    type="number"
                    name="order_total"
                    id="order-total"
                    value="0"
                    readonly
                />
            </div>
            <button type="submit">Submit via track.js</button>
            <button type="button" id="manual-btn">Submit Direct</button>
        </form>

        <div id="result"></div>

        <script
            src="https://kova.ng/track.js?token=03e48db222c74bcb9ec7a672a28a8fee"
            async
        ></script>
        <script>
            const result = document.getElementById('result');

            function showResult(title, data, isError) {
                result.className = isError ? 'error' : 'success';
                result.innerHTML =
                    '<strong>' +
                    title +
                    ':</strong>\n' +
                    JSON.stringify(data, null, 2);
                result.style.display = 'block';
            }

            document
                .getElementById('test-order-form')
                .addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const form = e.target;
                    const fields = {};
                    const formData = new FormData(form);
                    for (const [key, value] of formData.entries()) {
                        fields[key] = value;
                    }

                    const payload = {
                        token: '03e48db222c74bcb9ec7a672a28a8fee',
                        fields,
                        meta: {
                            url: window.location.href,
                            ts: new Date().toISOString(),
                        },
                    };

                    try {
                        const res = await fetch('https://kova.ng/api/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });
                        const data = await res.json();
                        showResult(
                            res.ok
                                ? 'track.js Flow Success'
                                : 'track.js Flow Error',
                            data,
                            !res.ok,
                        );
                    } catch (err) {
                        showResult(
                            'Network Error',
                            { message: err.message },
                            true,
                        );
                    }
                });

            const stateSelect = document.getElementById('state-select');
            const citySelect = document.getElementById('city-select');

            nigerianStates.forEach((state) => {
                const option = document.createElement('option');
                option.value = state.name;
                option.textContent = state.name;
                stateSelect.appendChild(option);
            });

            stateSelect.addEventListener('change', () => {
                const selectedState = nigerianStates.find(
                    (s) => s.name === stateSelect.value,
                );
                citySelect.innerHTML =
                    '<option value="">Select city / LGA</option>';
                if (selectedState) {
                    selectedState.cities.forEach((city) => {
                        const option = document.createElement('option');
                        option.value = city;
                        option.textContent = city;
                        citySelect.appendChild(option);
                    });
                    citySelect.disabled = false;
                } else {
                    citySelect.disabled = true;
                }
            });

            let productCounter = 0;
            const productItemsContainer =
                document.getElementById('product-items');
            const orderItemsHidden =
                document.getElementById('order-items-hidden');
            const orderTotalInput = document.getElementById('order-total');

            function createProductRow() {
                productCounter++;
                const rowId = `product-row-${productCounter}`;
                const row = document.createElement('div');
                row.id = rowId;
                row.className = 'product-row';
                row.style.cssText =
                    'display: flex; gap: 8px; margin-bottom: 12px; padding: 12px; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; flex-wrap: wrap; align-items: flex-end;';

                const productSelect = document.createElement('select');
                productSelect.name = `product_${productCounter}`;
                productSelect.required = true;
                productSelect.style.cssText =
                    'flex: 1; min-width: 200px; padding: 8px;';
                productSelect.innerHTML =
                    '<option value="">Select product</option>';
                vendorProducts.forEach((p) => {
                    const opt = document.createElement('option');
                    opt.value = p.product_name;
                    opt.textContent = `${p.product_name} - ₦${p.price.toLocaleString()}`;
                    opt.dataset.price = p.price;
                    opt.dataset.variants = JSON.stringify(
                        p.variants.map((v) => v.variant_name),
                    );
                    productSelect.appendChild(opt);
                });

                const variantSelect = document.createElement('select');
                variantSelect.name = `variant_${productCounter}`;
                variantSelect.style.cssText =
                    'flex: 1; min-width: 150px; padding: 8px;';
                variantSelect.innerHTML =
                    '<option value="">Select variant (if any)</option>';
                variantSelect.disabled = true;

                const qtyInput = document.createElement('input');
                qtyInput.type = 'number';
                qtyInput.name = `qty_${productCounter}`;
                qtyInput.value = 1;
                qtyInput.min = 1;
                qtyInput.style.cssText = 'width: 80px; padding: 8px;';
                qtyInput.required = true;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.textContent = 'Remove';
                removeBtn.style.cssText =
                    'background: #dc3545; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;';
                removeBtn.onclick = () => {
                    row.remove();
                    updateOrderSummary();
                };

                productSelect.onchange = () => {
                    const selectedOpt =
                        productSelect.options[productSelect.selectedIndex];
                    const variants = JSON.parse(
                        selectedOpt.dataset.variants || '[]',
                    );
                    variantSelect.innerHTML =
                        '<option value="">Select variant (if any)</option>';
                    if (variants.length > 0) {
                        variants.forEach((v) => {
                            const opt = document.createElement('option');
                            opt.value = v;
                            opt.textContent = v;
                            variantSelect.appendChild(opt);
                        });
                        variantSelect.disabled = false;
                    } else {
                        variantSelect.disabled = true;
                    }
                    updateOrderSummary();
                };

                variantSelect.onchange = updateOrderSummary;
                qtyInput.onchange = updateOrderSummary;
                qtyInput.oninput = updateOrderSummary;

                row.appendChild(productSelect);
                row.appendChild(variantSelect);
                row.appendChild(qtyInput);
                row.appendChild(removeBtn);
                productItemsContainer.appendChild(row);
            }

            function updateOrderSummary() {
                const rows =
                    productItemsContainer.querySelectorAll('.product-row');
                let total = 0;
                const items = [];

                rows.forEach((row) => {
                    const productSelect = row.querySelector(
                        'select[name^="product_"]',
                    );
                    const variantSelect = row.querySelector(
                        'select[name^="variant_"]',
                    );
                    const qtyInput = row.querySelector('input[name^="qty_"]');

                    if (productSelect.value) {
                        const productOpt =
                            productSelect.options[productSelect.selectedIndex];
                        const productPrice =
                            parseInt(productOpt.dataset.price) || 0;
                        const qty = parseInt(qtyInput.value) || 1;
                        const lineTotal = productPrice * qty;
                        total += lineTotal;

                        let itemStr = `${qty}x ${productOpt.textContent.split(' - ₦')[0]}`;
                        if (variantSelect.value) {
                            const variantOpt =
                                variantSelect.options[
                                    variantSelect.selectedIndex
                                ];
                            itemStr += ` (${variantOpt.textContent})`;
                        }
                        items.push(itemStr);
                    }
                });

                orderTotalInput.value = total;
                orderItemsHidden.value = items.join(', ');
            }

            document
                .getElementById('add-product-btn')
                .addEventListener('click', createProductRow);

            // Add initial product row
            createProductRow();

            document
                .getElementById('manual-btn')
                .addEventListener('click', async () => {
                    const form = document.getElementById('test-order-form');
                    const fields = {};
                    const formData = new FormData(form);
                    for (const [key, value] of formData.entries()) {
                        fields[key] = value;
                    }

                    const payload = {
                        token: '03e48db222c74bcb9ec7a672a28a8fee',
                        fields,
                        meta: {
                            url: window.location.href,
                            ts: new Date().toISOString(),
                        },
                    };

                    try {
                        const res = await fetch('https://kova.ng/api/order', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                        });
                        const data = await res.json();
                        showResult(
                            res.ok ? 'Direct API Success' : 'Direct API Error',
                            data,
                            !res.ok,
                        );
                    } catch (err) {
                        showResult(
                            'Network Error',
                            { message: err.message },
                            true,
                        );
                    }
                });
